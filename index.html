<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Компьютердің Ішкі Жады - 3D</title>
<style>
  body{margin:0; overflow:hidden; background:#0a1020; font-family: sans-serif;}
  #info{position:absolute; top:15px; left:15px; color:white; background:rgba(0,0,0,0.5); padding:12px 16px; border-radius:12px; backdrop-filter:blur(5px)}
  #info h2{margin:0 0 5px 0; font-size:18px}
  #info p{margin:3px 0; font-size:13px; opacity:0.9}
  #hint{position:absolute; bottom:15px; left:50%; transform:translateX(-50%); color:white; background:rgba(0,0,0,0.5); padding:8px 14px; border-radius:20px; font-size:13px}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="info">
  <h2>💻 Ішкі Жад - 3D Модель</h2>
  <p>🖱️ Тышқанмен айналдыр / дөңгелекпен жақындат</p>
  <p id="status">⚙️ Жиналған күйі</p>
</div>
<div id="hint">Басып тұрып шашырат → жина</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a1020);
scene.fog = new THREE.Fog(0x0a1020, 10, 25);

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(3,2.5,4);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// Lights
scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const dir = new THREE.DirectionalLight(0xffffff, 1.2);
dir.position.set(5,10,5); dir.castShadow = true;
scene.add(dir);
const point = new THREE.PointLight(0x00ffff, 0.5, 10);
point.position.set(0,3,0); scene.add(point);

// Materials
const matCase = new THREE.MeshStandardMaterial({color:0x2a2a2a, metalness:0.3, roughness:0.7});
const matBoard = new THREE.MeshStandardMaterial({color:0x1a5c2a});
const matCPU = new THREE.MeshStandardMaterial({color:0xc0c0c0, metalness:0.8});
const matRAM = new THREE.MeshStandardMaterial({color:0x222222});
const matRAM2 = new THREE.MeshStandardMaterial({color:0x00cc66});
const matHDD = new THREE.MeshStandardMaterial({color:0xaaaaaa, metalness:0.6});
const matGPU = new THREE.MeshStandardMaterial({color:0xcc2222});

const group = new THREE.Group();
scene.add(group);

function createPart(geometry, material, pos, label){
  const m = new THREE.Mesh(geometry, material);
  m.position.copy(pos);
  m.castShadow = true; m.receiveShadow = true;
  m.userData = { startPos: pos.clone(), label };
  group.add(m);
  return m;
}

// Case bottom
createPart(new THREE.BoxGeometry(4,0.2,3), matCase, new THREE.Vector3(0,-1,0), "Корпус");
// Motherboard
createPart(new THREE.BoxGeometry(3.5,0.05,2.5), matBoard, new THREE.Vector3(0,-0.85,0), "Аналық тақта");
// CPU
createPart(new THREE.BoxGeometry(0.6,0.15,0.6), matCPU, new THREE.Vector3(-0.8,-0.7,0.3), "CPU - Орталық процессор");
// RAM 1
createPart(new THREE.BoxGeometry(1.4,0.1,0.2), matRAM, new THREE.Vector3(0.5,-0.7,0.8), "RAM - Жедел жад");
createPart(new THREE.BoxGeometry(1.2,0.05,0.05), matRAM2, new THREE.Vector3(0.5,-0.62,0.8), "RAM");
// RAM 2
createPart(new THREE.BoxGeometry(1.4,0.1,0.2), matRAM, new THREE.Vector3(0.5,-0.7,0.5), "RAM 2");
createPart(new THREE.BoxGeometry(1.2,0.05,0.05), matRAM2, new THREE.Vector3(0.5,-0.62,0.5), "RAM");
// GPU
createPart(new THREE.BoxGeometry(0.2,0.4,1.5), matGPU, new THREE.Vector3(1.2,-0.5,-0.2), "GPU - Бейнекарта");
// HDD
createPart(new THREE.BoxGeometry(0.8,0.2,1), matHDD, new THREE.Vector3(-1.2,-0.7,-0.7), "HDD - Қатты диск");
// SSD
createPart(new THREE.BoxGeometry(0.6,0.05,0.8), new THREE.MeshStandardMaterial({color:0x3333ff}), new THREE.Vector3(-0.2,-0.75,-0.8), "SSD - Ішкі жад");

const exploded = [];
group.children.forEach((mesh,i)=>{
  if(i<2) return;
  const dir = mesh.userData.startPos.clone().normalize();
  if(dir.length()<0.1) dir.set((Math.random()-0.5),1,Math.random()-0.5);
  dir.normalize();
  exploded.push(dir.multiplyScalar(2.5 + Math.random()*1.5));
});

let isExploded = false;
let t = 0;
let animating = false;

function toggle(){
  animating = true; t = 0;
  document.getElementById('status').innerText = isExploded ? "⚙️ Жиналуда..." : "💥 Шашырауда...";
}

renderer.domElement.addEventListener('click', toggle);
window.addEventListener('keydown', (e)=>{ if(e.code==='Space') toggle(); });

function animate(){
  requestAnimationFrame(animate);
  controls.update();
  
  if(animating){
    t += 0.02;
    if(t>=1){ t=1; animating=false; isExploded=!isExploded; 
      document.getElementById('status').innerText = isExploded ? "💥 Шашыраған - Қайта жинау үшін бас" : "⚙️ Жиналған - Шашырату үшін бас";
    }
    group.children.forEach((mesh,i)=>{
      if(i<2) return;
      const idx = i-2;
      const start = mesh.userData.startPos;
      const exp = exploded[idx];
      const target = isExploded ? start.clone().add(exp) : start;
      const from = isExploded ? start : start.clone().add(exp);
      mesh.position.lerpVectors(from, target, ease(t));
      mesh.rotation.y += 0.01 * (isExploded ? 1 : 0);
    });
  }
  renderer.render(scene, camera);
}
function ease(x){ return x<0.5 ? 2*x*x : 1-Math.pow(-2*x+2,2)/2; }

animate();
setTimeout(toggle, 1500);

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
