<!DOCTYPE html><html lang="kk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Компьютер 3D</title><style>body{margin:0;overflow:hidden;background:#0b1430} #t{position:absolute;top:12px;width:100%;text-align:center;color:#fff;font:900 16px Arial;text-shadow:0 0 10px #00eaff} #b{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:#00eaff;color:#000;border:0;padding:14px 28px;border-radius:30px;font:900 16px Arial}</style><script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script></head><body><div id="t">💻 КОМПЬЮТЕРДІҢ ІШКІ ҚҰРЫЛЫМЫ - 3D (Саусақпен айналдыр)</div><button id="b">💥 ШАШЫРАТУ</button><script type="module">
import * as THREE from 'three'; import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x0b1430);
const cam=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,0.1,100); cam.position.set(3.2,2.2,2.8);
const ren=new THREE.WebGLRenderer({antialias:true}); ren.setSize(innerWidth,innerHeight); ren.setPixelRatio(devicePixelRatio); document.body.appendChild(ren.domElement);
const ctr=new OrbitControls(cam,ren.domElement); ctr.enableDamping=true; ctr.target.set(0,-0.5,0);
scene.add(new THREE.AmbientLight(0xffffff,2.5)); const dl=new THREE.DirectionalLight(0xffffff,2); dl.position.set(5,5,5); scene.add(dl); const dl2=new THREE.DirectionalLight(0xffffff,1); dl2.position.set(-5,-2,-5); scene.add(dl2);
const g=new THREE.Group(); scene.add(g); const P=[];
const M={c:new THREE.MeshStandardMaterial({color:0x2a2a35}), board:new THREE.MeshStandardMaterial({color:0x1ea65a}), cpu:new THREE.MeshStandardMaterial({color:0xffffff,emissive:0x444444}), ram:new THREE.MeshStandardMaterial({color:0x111111}), gpu:new THREE.MeshStandardMaterial({color:0xff2222}), hdd:new THREE.MeshStandardMaterial({color:0xdddddd}), psu:new THREE.MeshStandardMaterial({color:0x333333})};
function add(n,m,geo,pos){const me=new THREE.Mesh(geo,M[m]); me.position.copy(pos); me.userData={s:pos.clone(),n}; g.add(me); P.push(me); return me;}
add("case","c",new THREE.BoxGeometry(5,0.25,4),new THREE.Vector3(0,-1.2,0));
add("board","board",new THREE.BoxGeometry(4.2,0.08,3.2),new THREE.Vector3(0,-1.02,0));
const cpu=add("cpu","cpu",new THREE.BoxGeometry(0.7,0.18,0.7),new THREE.Vector3(-1,-0.85,0.6));
add("cooler","c",new THREE.CylinderGeometry(0.45,0.45,0.3,24),new THREE.Vector3(-1,-0.52,0.6));
add("ram1","ram",new THREE.BoxGeometry(1.7,0.14,0.26),new THREE.Vector3(0.45,-0.83,1.05));
add("ram2","ram",new THREE.BoxGeometry(1.7,0.14,0.26),new THREE.Vector3(0.45,-0.83,0.68));
add("gpu","gpu",new THREE.BoxGeometry(0.32,0.55,2.2),new THREE.Vector3(1.55,-0.58,0.1));
add("hdd","hdd",new THREE.BoxGeometry(1.1,0.28,1.35),new THREE.Vector3(-1.35,-0.8,-0.9));
add("ssd","gpu",new THREE.BoxGeometry(0.85,0.07,1.05),new THREE.Vector3(-0.1,-0.9,-1.1));
add("psu","psu",new THREE.BoxGeometry(1.25,0.85,1.55),new THREE.Vector3(1.55,-0.6,-1.25));
const dirs=P.map(p=>{if(p.userData.n=="case"||p.userData.n=="board")return new THREE.Vector3(0,0,0); let d=p.position.clone(); d.y=Math.abs(d.y)+2.2; d.normalize(); return d.multiplyScalar(3.8);});
let ex=false,t=0,an=false; const btn=document.getElementById('b');
function tog(){if(an)return; an=true; t=0; btn.textContent="⏳";}
btn.onclick=tog; ren.domElement.addEventListener('click',()=>{if(!an) tog();});
(function loop(){requestAnimationFrame(loop); ctr.update(); if(an){t+=0.035; if(t>=1){t=1; an=false; ex=!ex; btn.textContent=ex?"🔧 ЖИНАУ":"💥 ШАШЫРАТУ";} P.forEach((m,i)=>{if(m.userData.n=="case"||m.userData.n=="board")return; const s=m.userData.s,d=dirs[i]; if(!ex) m.position.lerpVectors(s,s.clone().add(d),t); else m.position.lerpVectors(s.clone().add(d),s,t);});} ren.render(scene,cam);})();
setTimeout(tog,800);
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight; cam.updateProjectionMatrix(); ren.setSize(innerWidth,innerHeight);});
</script></body></html>
