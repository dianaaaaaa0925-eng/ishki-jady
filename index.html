<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Human Atlas</title><style>*{box-sizing:border-box;font-family:sans-serif}body{margin:0;background:#f8f7f5;display:flex;height:100vh}.side{width:260px;background:#fff;border-right:1px solid #ddd;padding:16px;overflow:auto}.main{flex:1;padding:16px;overflow:auto}.grid{display:flex;flex-wrap:wrap;gap:10px}.mus{width:105px;background:#fff;border-radius:14px;padding:8px;text-align:center;border:2px solid transparent;box-shadow:0 2px 8px rgba(0,0,0,.06);cursor:pointer}.mus.active{border-color:#000}.mus.hidden{opacity:.25}.info{width:300px;background:#fff;border-left:1px solid #ddd;padding:16px}.img{height:55px;background:#ffdede;border-radius:10px;margin-bottom:6px}</style></head><body>
<div class="side"><h3>Human Atlas</h3><input id="s" placeholder="Search muscle" style="width:100%;padding:8px;border-radius:10px;border:1px solid #ddd;margin:10px 0"><b>Muscles</b><div id="list" style="font-size:13px"></div></div>
<div class="main"><h4>Human Body / Muscles</h4><div class="grid" id="grid"></div></div>
<div class="info"><h3 id="n">Right Gracilis</h3><small id="fma">FMA:22350</small><p id="d" style="font-size:13px;color:#555">The most slender muscle of thigh.</p><button id="rm" style="width:100%;padding:10px;background:#000;color:#fff;border-radius:10px;border:none">Remove / Add</button><button id="iso" style="width:100%;padding:10px;background:#fff;border:1px solid #ddd;border-radius:10px;margin-top:8px">Isolate</button></div>
<script>
const muscles=[{name:'Right Gracilis',fma:'FMA:22350',desc:'Most superficial medial thigh muscle. Most slender muscle.'},{name:'Sartorius',fma:'FMA:22353',desc:'Longest muscle in body.'},{name:'Rectus Femoris',fma:'FMA:22428',desc:'Part of quadriceps.'},{name:'Biceps Brachii',fma:'FMA:37682',desc:'Flexes elbow.'},{name:'Pectoralis Major',fma:'FMA:27816',desc:'Large chest muscle.'},{name:'Adductor Longus',fma:'FMA:22441',desc:'Adducts thigh.'}];
let sel=muscles[0];
const grid=document.getElementById('grid'),list=document.getElementById('list');
function render(){grid.innerHTML='';list.innerHTML='';muscles.filter(m=>m.name.toLowerCase().includes(s.value.toLowerCase())).forEach(m=>{let d=document.createElement('div');d.className='mus'+(sel.name==m.name?' active':'')+(m.hidden?' hidden':'');d.innerHTML=`<div class=img></div><small>${m.name}</small>`;d.onclick=()=>select(m);grid.appendChild(d);let r=document.createElement('div');r.textContent=m.name;r.style.padding='6px';r.style.cursor='pointer';if(sel.name==m.name)r.style.background='#eee';r.onclick=()=>select(m);list.appendChild(r);});}
function select(m){sel=m;n.textContent=m.name;fma.textContent=m.fma;d.textContent=m.desc;render();}
rm.onclick=()=>{sel.hidden=!sel.hidden;render();};iso.onclick=()=>{muscles.forEach(x=>x.hidden=x.name!=sel.name);render();};s.oninput=render;render();select(muscles[0]);
</script></body></html>
