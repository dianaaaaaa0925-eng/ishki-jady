<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Компьютер Құрылымы</title>
<style>
body{margin:0;overflow:hidden;background:#070d1f;font-family:sans-serif}
#t{position:absolute;top:10px;width:100%;text-align:center;color:#fff;font-weight:800;font-size:18px}
#l{position:absolute;top:50px;left:10px;display:flex;flex-direction:column;gap:5px}
.lb{color:#fff;background:rgba(0,0,0,.65);border-left:4px solid;padding:6px 10px;border-radius:6px;font-size:11px}
#btn{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:linear-gradient(90deg,#00d2ff,#3a7bd5);color:#fff;border:none;padding:14px 28px;border-radius:30px;font-weight:800;font-size:15px}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="t">💻 КОМПЬЮТЕРДІҢ ІШКІ ҚҰРЫЛЫМЫ</div>
<div id="l"></div>
<button id="btn">💥 ШАШЫРАТУ</button>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x070d1f);
const cam=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,100);cam.position.set(4.5,3,4);
const ren=new THREE.WebGLRenderer({antialias:true});ren.setSize(innerWidth,innerHeight);document.body.appendChild(ren.domElement);
const ctr=new OrbitControls(cam,ren.domElement);ctr.enableDamping=true;
scene.add(new THREE.AmbientLight(0xffffff,1));
const dl=new THREE.DirectionalLight(0xffffff,1.2);dl.position.set(5,10,5);scene.add(dl);
const M={
c:new THREE.MeshStandardMaterial({color:0x1e1e24}),
b:new THREE.MeshStandardMaterial({color:0x144d2a}),
cpu:new THREE.MeshStandardMaterial({color:0xeeeeee,metalness:0.9}),
ram:new THREE.MeshStandardMaterial({color:0x111111}),
gpu:new THREE.MeshStandardMaterial({color:0xc62828}),
hdd:new THREE.MeshStandardMaterial({color:0x9e9e9e}),
psu:new THREE.MeshStandardMaterial({color:0x222222})
};
const g=new THREE.Group();scene.add(g);
const P=[];
function add(n,m,geo,pos){const me=new THREE.Mesh(geo,M[m]);me.position.copy(pos);me.userData={n,s:pos.clone()};g.add(me);P.push(me)}
add("case","c",new THREE.BoxGeometry(5,0.25,4),new THREE.Vector3(0,-1.2,0));
add("board","b",new THREE.BoxGeometry(4.2,0.08,3.2),new THREE.Vector3(0,-1.02,0));
add("cpu","cpu",new THREE.BoxGeometry(0.7,0.18,0.7),new THREE.Vector3(-1,-0.85,0.6));
add("cooler","c",new THREE.CylinderGeometry(0.4,0.4,0.25,16),new THREE.Vector3(-1,-0.55,0.6));
add("ram1","ram",new THREE.BoxGeometry(1.6,0.12,0.25),new THREE.Vector3(0.4,-0.85,1));
add("ram2","ram",new THREE.BoxGeometry(1.6,0.12,0.25),new THREE.Vector3(0.4,-0.85,0.65));
add("gpu","gpu",new THREE.BoxGeometry(0.3,0.5,2),new THREE.Vector3(1.5,-0.6,0));
add("hdd","hdd",new THREE.BoxGeometry(1,0.25,1.3),new THREE.Vector3(-1.3,-0.82,-0.9));
add("ssd","gpu",new THREE.BoxGeometry(0.8,0.06,1),new THREE.Vector3(-0.1,-0.92,-1.1));
add("psu","psu",new THREE.BoxGeometry(1.2,0.8,1.5),new THREE.Vector3(1.5,-0.65,-1.2));
const dirs=P.map(p=>{if(p.userData.n=="case"||p.userData.n=="board")return new THREE.Vector3(0,0,0);let d=p.position.clone();d.y=Math.abs(d.y)+1.5;d.normalize();return d.multiplyScalar(3+Math.random())});
document.getElementById('l').innerHTML='<div class=lb style=border-color:#2e7d32>🟩 Аналық тақта</div><div class=lb style=border-color:#eee>⬜ Орталық процессор</div><div class=lb style=border-color:#111>⬛ Жедел жад RAM</div><div class=lb style=border-color:#c62828>🟥 Бейнекарта</div><div class=lb style=border-color:#222>⬛ Блок питания</div><div class=lb style=border-color:#9e9e9e>⬜ Ішкі жад HDD/SSD</div>';
let ex=false,t=0,an=false;const btn=document.getElementById('btn');
function tog(){if(an)return;an=true;t=0;btn.textContent="⏳..."}
btn.onclick=tog;ren.domElement.onclick=tog;
(function loop(){requestAnimationFrame(loop);ctr.update();if(an){t+=0.02;if(t>=1){t=1;an=false;ex=!ex;btn.textContent=ex?"🔧 ЖИНАУ":"💥 ШАШЫРАТУ"}P.forEach((m,i)=>{if(m.userData.n=="case"||m.userData.n=="board")return;const s=m.userData.s,d=dirs[i];if(!ex)m.position.lerpVectors(s,s.clone().add(d),t);else m.position.lerpVectors(s.clone().add(d),s,t)})}ren.render(scene,cam)})();
setTimeout(tog,1000);
</script>
</body>
</html>
